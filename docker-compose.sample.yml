services:
  db:
    image: postgres:18
    expose:
      - "5432"
    environment:
      POSTGRES_USER: src
      POSTGRES_PASSWORD: src
      POSTGRES_DB: src
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U src -d src" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/src
      SPRING_DATASOURCE_USERNAME: src
      SPRING_DATASOURCE_PASSWORD: src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
